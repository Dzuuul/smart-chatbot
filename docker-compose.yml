version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smart-chatbot-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smart-chatbot-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_chatbot?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-chatbot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smart-chatbot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_chatbot?schema=public
    depends_on:
      - postgres
      - api
    networks:
      - smart-chatbot-network

  # Next.js Docs App
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    container_name: smart-chatbot-docs
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - smart-chatbot-network


  # Prisma Studio (Development only)
  prisma-studio:
    image: node:20-alpine
    container_name: smart-chatbot-prisma-studio
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm --filter=database prisma:studio"
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_chatbot?schema=public
    volumes:
      - ./packages/database:/app/packages/database
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-chatbot-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  smart-chatbot-network:
    driver: bridge
