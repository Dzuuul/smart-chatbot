# Docker Compose Development Configuration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: smart-chatbot-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_chatbot
      TZ: Asia/Jakarta
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - smart-chatbot-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prisma Studio
  prisma-studio:
    image: node:20-alpine
    container_name: smart-chatbot-prisma-studio-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm install && pnpm --filter=database prisma:studio"
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_chatbot?schema=public
      TZ: Asia/Jakarta
    volumes:
      - ./packages/database:/app/packages/database
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - pnpm_store:/app/.pnpm-store
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-chatbot-dev-network

volumes:
  postgres_dev_data:
    driver: local
  pnpm_store:
    driver: local

networks:
  smart-chatbot-dev-network:
    driver: bridge
